services:
  app1:
    image: nginx:alpine
    container_name: app1
    ports:
      - "8080:80"
    volumes:
      - ./config/app1.conf:/etc/nginx/conf.d/default.conf
    environment:
      ENV_REQUIRED: "true"

  app2:
    image: nginx:alpine
    container_name: app2
    ports:
      - "8081:80"

  app3:
    image: alpine:latest
    container_name: app3
    command: sh -c "echo 'test' > /data/test.txt && cat /data/test.txt"
    volumes:
      - ./data:/data:rw

  app4:
    image: alpine:latest
    container_name: app4
    command: sh -c "ping nonexistent-host || exit 1"


  app5:
    image: alpine:latest
    container_name: app5
    command: sh -c "exit 1"
    restart: on-failure:3

  app6:
    image: postgres:15-alpine
    container_name: app6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: "appdb"
